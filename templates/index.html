<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimvone Free App</title>
    <!-- Monetag Verification Tag -->
    <meta name="monetag" content="9a13e71ad17b33662ca1d9bb5ee2eff4">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .app-logo-container {
            display: flex;
            align-items: center;
            max-width: 320px;
            padding: 10px;
            margin-bottom: 20px;
        }
        .app-logo-svg {
            filter: drop-shadow(0px 0px 10px rgba(0, 242, 254, 0.3));
        }
        .pulse-ring {
            transform-origin: 60px 60px;
            animation: logoPulse 2.5s infinite ease-in-out;
        }
        @keyframes logoPulse {
            0% { stroke-opacity: 0.6; transform: scale(0.98); }
            50% { stroke-opacity: 1; transform: scale(1.03); filter: drop-shadow(0 0 12px #00f2fe); }
            100% { stroke-opacity: 0.6; transform: scale(0.98); }
        }
    </style>
</head>
<body>

    <!-- ArcadeX / Kimvone App Neon Logo -->
    <div class="app-logo-container">
      <svg class="app-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="auto">
        <defs>
          <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />
          </linearGradient>
          <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00ff87" />
            <stop offset="100%" stop-color="#60efff" />
          </linearGradient>
          <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <circle cx="60" cy="60" r="45" fill="none" stroke="url(#neonGlow)" stroke-width="4" filter="url(#glowFilter)" class="pulse-ring" />
        <path d="M 42,50 C 42,44 48,42 54,42 L 66,42 C 72,42 78,44 78,50 L 80,68 C 80,76 72,78 68,72 L 64,66 L 56,66 L 52,72 C 48,78 40,76 40,68 Z" 
              fill="none" stroke="url(#greenGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)" />
        <path d="M 48,54 L 52,54 M 50,52 L 50,56" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="70" cy="53" r="1.5" fill="#00ff87" />
        <circle cx="73" cy="56" r="1.5" fill="#00ff87" />
        <text x="125" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
          KIMVONE
        </text>
        <text x="125" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="url(#greenGlow)" letter-spacing="4">
          FREE APP
        </text>
      </svg>
    </div>

    <h1>Welcome to Kimvone Free App</h1>
    <p>Your PWA gaming portal is live!</p>

</body>
</html>
